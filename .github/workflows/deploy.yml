# ============================================================
# פריסה: main → מאגר הפריסה → Railway
# ------------------------------------------------------------
# המאגר הזה הוא המקור. מה שרץ באוויר יושב במאגר אחר
# (noamedery1/beitardle), ו-Railway מגיש את **השורש** שלו. הצעד
# הזה מעתיק את dist/ לשורש וגם ל-sportdle/, ומריץ את בדיקת העץ.
#
# למה פעמיים: הדומיין הקנוני מגיש את השורש, ולכן שם המשחק חייב
# לשבת. sportdle/ נשאר כי קישורים שפורסמו מצביעים לשם.
#
# ביתרדל, העמוד שממנו הכל התחיל, יושב עד הפריסה הזאת בשורש.
# tools/archive-legacy.mjs מעביר אותו ל-beitardle/ ב-git mv לפני
# ההעתקה — הוא נשאר חי בכתובת משלו, עם ההיסטוריה שלו.
#
# סוד שצריך להגדיר:
#   DEPLOY_TOKEN — Personal Access Token עם הרשאת contents:write
#                  למאגר הפריסה בלבד (Fine-grained token).
#                  ה-GITHUB_TOKEN המובנה תקף רק למאגר הזה.
#
# למה בדיקת qa-deploy כאן ולא בבנייה: היא בודקת את **עץ הפריסה**
# כפי שהוא ייצא לאוויר, כולל index.html הישן של ביתרדל שיושב
# בשורש שם ולא קיים במאגר הזה בכלל.
# ============================================================
name: פריסה

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "data/clubs/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  DEPLOY_REPO: noamedery1/beitardle
  DEPLOY_DIR: sportdle

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: מקור
        uses: actions/checkout@v7
        with:
          path: src-repo

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: בנייה
        working-directory: src-repo
        run: node scripts/build.mjs

      # הבנייה רצה תמיד — היא הבדיקה שהמקור תקין, וזה שווה גם בלי
      # פריסה. הדחיפה מדלגת בשקט כשאין טוקן, במקום להיכשל בכל קומיט.
      - name: יש טוקן פריסה?
        id: secrets
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::notice::DEPLOY_TOKEN לא מוגדר — נבנה ואומת, לא נפרס."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      # הטוקן נבדק לפני העבודה ולא אחריה. מאגר הפריסה ציבורי, ולכן
      # ה-checkout שלו מצליח גם עם טוקן פג-תוקף או בלי הרשאת כתיבה —
      # קריאה של מאגר ציבורי לא דורשת טוקן בכלל. בלי הבדיקה הזאת
      # הכישלון מתגלה רק בדחיפה, בסוף הריצה, בהודעת git שלא אומרת
      # איזה סוד לתקן ואיפה.
      - name: לטוקן יש הרשאת כתיבה?
        if: steps.secrets.outputs.ready == 'yes'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
                   -H "Authorization: Bearer $DEPLOY_TOKEN" \
                   -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/$DEPLOY_REPO")
          node src-repo/tools/token-check.mjs "$code" "$body" "$DEPLOY_REPO"

      - name: מאגר הפריסה
        if: steps.secrets.outputs.ready == 'yes'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DEPLOY_REPO }}
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: deploy-repo

      # ריצה ראשונה בלבד, ואחר כך no-op: מעביר את ביתרדל ההיסטורי
      # מהשורש ל-beitardle/ ב-git mv, לפני שההעתקה דורסת אותו.
      - name: ארכוב ביתרדל ההיסטורי
        if: steps.secrets.outputs.ready == 'yes'
        run: node src-repo/tools/archive-legacy.mjs deploy-repo

      - name: העברת dist
        if: steps.secrets.outputs.ready == 'yes'
        run: |
          # פעמיים. השורש הוא הדומיין הקנוני, ו-sportdle/ נשאר כדי
          # שקישורים ותיקים לכתובת הישנה לא יישברו.
          cp -r src-repo/dist/. "deploy-repo/"
          mkdir -p "deploy-repo/${{ env.DEPLOY_DIR }}"
          cp -r src-repo/dist/. "deploy-repo/${{ env.DEPLOY_DIR }}/"

      - name: בדיקת עץ הפריסה
        if: steps.secrets.outputs.ready == 'yes'
        run: node src-repo/tools/qa-deploy.mjs deploy-repo

      - name: דחיפה
        if: steps.secrets.outputs.ready == 'yes'
        working-directory: deploy-repo
        run: |
          set -e
          if [ -z "$(git status --porcelain)" ]; then
            echo "עץ הפריסה זהה — אין מה לדחוף."
            exit 0
          fi
          git config user.name  "sportdle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ספורטדל: בנייה מ-${GITHUB_SHA::7}"
          git push
