# ============================================================
# בניית iOS
# ------------------------------------------------------------
# **מה זה כן עושה:** מקמפל את האפליקציה לסימולטור על ראנר macOS.
# זה תופס בעיות קומפילציה, תוסף שבור וקונפיגורציה שגויה — הרבה
# לפני שיש חשבון מפתח.
#
# **מה זה לא עושה:** לא מייצר .ipa להתקנה על אייפון. לזה נדרשת
# חתימה — חשבון מפתח אפל בתשלום, תעודת הפצה ופרופיל, שנכנסים
# כסודות המאגר. בלי חתימה אפל לא מתקינה כלום על מכשיר אמיתי.
#
# הרצה ידנית בלבד (workflow_dispatch). ראנרים של macOS יקרים
# בדקות, ואין סיבה להריץ אותם בכל דחיפה כשהיעד הראשון הוא APK.
#
# Capacitor 8 משתמש ב-Package.swift (SPM) ולא ב-CocoaPods, ולכן
# אין כאן pod install ואין תלות ב-Ruby.
# ============================================================
name: iOS

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"          # Capacitor 8 דורש >= 22
          cache: npm

      - name: התקנה
        run: npm ci

      - name: בנייה
        run: node scripts/build.mjs

      - name: קישורים פנימיים
        run: node tools/links.mjs dist

      - name: הכנת עותק האפליקציה
        run: node tools/app-prepare.mjs

      - name: העברת dist לאפליקציה
        run: |
          out=$(npx cap sync ios 2>&1) || {
            echo "$out" | tail -30
            echo "::error::cap sync ios נכשל · $(echo "$out" | tail -1 | cut -c1-300)"
            exit 1
          }
          echo "$out" | tail -6

      # ללא חתימה. CODE_SIGNING_ALLOWED=NO הוא מה שמאפשר לקמפל
      # בלי תעודה — הפלט מתאים לסימולטור ולא למכשיר.
      #
      # -derivedDataPath קבוע, כדי שהשלב הבא ידע איפה ה-.app.
      - name: xcodebuild — סימולטור
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -40

      # ============================================================
      # הרצה בסימולטור וצילום מסך
      # ------------------------------------------------------------
      # קיים כדי שאפשר יהיה לראות את גרסת ה-iOS **בלי מק ובלי
      # אייפון**. זה לא מחליף בדיקה במכשיר אמיתי — הוא לא יתפוס
      # מקלדת, רטט או גיליון שיתוף — אבל הוא כן תופס פריסה
      # שנשברה, נכס חסר ושגיאת JS, וזה הרוב.
      #
      # שם הסימולטור נבחר מהרשימה בפועל ואינו מקודד: השמות
      # משתנים בין גרסאות Xcode, ו-boot על שם שלא קיים נכשל.
      # ============================================================
      - name: הרצה בסימולטור
        working-directory: ios/App
        run: |
          set -e
          APP=$(find build/Build/Products -maxdepth 3 -name "App.app" | head -1)
          if [ -z "$APP" ]; then echo "::error::לא נמצא App.app"; exit 1; fi

          read ID NAME <<< "$(xcrun simctl list devices available -j | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);const all=[].concat(...Object.values(j.devices));const p=all.find(x=>/iPhone 1[6-9]/.test(x.name))||all.find(x=>/iPhone/.test(x.name))||all[0];if(!p)process.exit(1);console.log(p.udid+" "+p.name)})')"
          echo "::notice::סימולטור: $NAME"

          xcrun simctl boot "$ID" || true
          xcrun simctl bootstatus "$ID" -b
          xcrun simctl install "$ID" "$APP"
          xcrun simctl launch "$ID" sportdle.techbynoam.com

          mkdir -p ../../store/sim
          for i in 1 2 3; do
            sleep 6
            xcrun simctl io "$ID" screenshot "../../store/sim/ios-sim-$i.png"
          done

          # שגיאות מהלוג. אינפורמטיבי בלבד — לא מפיל את הריצה.
          xcrun simctl spawn "$ID" log show --last 3m --style compact 2>/dev/null \
            | grep -iE "App.*(error|exception|failed)" | head -20 \
            > ../../store/sim/log.txt || true
          if [ -s ../../store/sim/log.txt ]; then
            echo "::warning::יש שורות שגיאה בלוג — ראה log.txt ב-artifact"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sportdle-ios-sim
          path: store/sim/
          retention-days: 30

      - name: סיכום
        run: echo "::notice::iOS קומפל והורץ בסימולטור. צילומי המסך ב-artifact sportdle-ios-sim. .ipa להתקנה במכשיר דורש חשבון מפתח אפל וחתימה."
