# ============================================================
# בניית iOS
# ------------------------------------------------------------
# **מה זה כן עושה:** מקמפל את האפליקציה לסימולטור על ראנר macOS.
# זה תופס בעיות קומפילציה, תוסף שבור וקונפיגורציה שגויה — הרבה
# לפני שיש חשבון מפתח.
#
# **מה זה לא עושה:** לא מייצר .ipa להתקנה על אייפון. לזה נדרשת
# חתימה — חשבון מפתח אפל בתשלום, תעודת הפצה ופרופיל, שנכנסים
# כסודות המאגר. בלי חתימה אפל לא מתקינה כלום על מכשיר אמיתי.
#
# הרצה ידנית בלבד (workflow_dispatch). ראנרים של macOS יקרים
# בדקות, ואין סיבה להריץ אותם בכל דחיפה כשהיעד הראשון הוא APK.
#
# Capacitor 8 משתמש ב-Package.swift (SPM) ולא ב-CocoaPods, ולכן
# אין כאן pod install ואין תלות ב-Ruby.
# ============================================================
name: iOS

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"          # Capacitor 8 דורש >= 22
          cache: npm

      - name: התקנה
        run: npm ci

      - name: בנייה
        run: node scripts/build.mjs

      - name: קישורים פנימיים
        run: node tools/links.mjs dist

      - name: הכנת עותק האפליקציה
        run: node tools/app-prepare.mjs

      - name: העברת dist לאפליקציה
        run: |
          out=$(npx cap sync ios 2>&1) || {
            echo "$out" | tail -30
            echo "::error::cap sync ios נכשל · $(echo "$out" | tail -1 | cut -c1-300)"
            exit 1
          }
          echo "$out" | tail -6

      # ללא חתימה. CODE_SIGNING_ALLOWED=NO הוא מה שמאפשר לקמפל
      # בלי תעודה — הפלט מתאים לסימולטור ולא למכשיר.
      #
      # -derivedDataPath קבוע, כדי שהשלב הבא ידע איפה ה-.app.
      - name: xcodebuild — סימולטור
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -40

      # ============================================================
      # הרצה בסימולטור וצילום מסך
      # ------------------------------------------------------------
      # קיים כדי שאפשר יהיה לראות את גרסת ה-iOS **בלי מק ובלי
      # אייפון**. לא מחליף בדיקה במכשיר — הסימולטור לא יתפוס
      # מקלדת, רטט או גיליון שיתוף — אבל כן תופס פריסה שנשברה,
      # נכס חסר ושגיאת JS, וזה הרוב.
      #
      # continue-on-error בכוונה: הבנייה היא מה שחשוב, והצילום
      # הוא בונוס. תקלה בסימולטור לא תסמן את הבנייה כאדומה.
      #
      # **כל פקודת simctl עטופה ב-timeout.** בריצה הראשונה
      # bootstatus חסם ולא חזר, וה-job רץ 10 דקות בלי להתקדם עד
      # שבוטל. אתחול סימולטור על ראנר קר הוא איטי ולפעמים תקוע,
      # ובלי גבול זמן זה אוכל עד שש שעות של ראנר macOS.
      # ============================================================
      - name: הרצה בסימולטור
        continue-on-error: true
        working-directory: ios/App
        run: |
          set +e
          APP=$(find build/Build/Products -maxdepth 3 -name "App.app" | head -1)
          if [ -z "$APP" ]; then echo "::warning::לא נמצא App.app"; exit 0; fi

          ID=$(xcrun simctl list devices available -j | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);const all=[].concat(...Object.values(j.devices));const p=all.find(x=>/iPhone 1[6-9]/.test(x.name))||all.find(x=>/iPhone/.test(x.name))||all[0];if(!p)process.exit(1);console.log(p.udid)})')
          if [ -z "$ID" ]; then echo "::warning::לא נמצא סימולטור"; exit 0; fi
          echo "::notice::סימולטור $ID"

          # 300 שניות לאתחול. הלוג של הכשל נשמר ל-artifact.
          mkdir -p ../../store/sim
          xcrun simctl boot "$ID" 2>&1 | tail -3
          if ! timeout 300 xcrun simctl bootstatus "$ID" -b; then
            echo "::warning::הסימולטור לא סיים לעלות בתוך 5 דקות"
            xcrun simctl shutdown "$ID" 2>/dev/null
            exit 0
          fi

          timeout 120 xcrun simctl install "$ID" "$APP" || {
            echo "::warning::ההתקנה בסימולטור נכשלה"; exit 0; }
          timeout 60 xcrun simctl launch "$ID" sportdle.techbynoam.com || {
            echo "::warning::ההרצה בסימולטור נכשלה"; exit 0; }

          for i in 1 2 3; do
            sleep 6
            timeout 60 xcrun simctl io "$ID" screenshot "../../store/sim/ios-sim-$i.png"
          done
          ls -la ../../store/sim/

          # log show סורק את כל מחסן הלוגים ויכול להיות איטי מאוד.
          timeout 90 xcrun simctl spawn "$ID" log show --last 2m --style compact \
            > ../../store/sim/full-log.txt 2>/dev/null
          grep -iE "App.*(error|exception|failed)" ../../store/sim/full-log.txt \
            | head -20 > ../../store/sim/errors.txt
          rm -f ../../store/sim/full-log.txt
          if [ -s ../../store/sim/errors.txt ]; then
            echo "::warning::יש שורות שגיאה בלוג — ראה errors.txt ב-artifact"
          fi
          xcrun simctl shutdown "$ID" 2>/dev/null
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sportdle-ios-sim
          path: store/sim/
          retention-days: 30
          if-no-files-found: warn

      - name: סיכום
        run: echo "::notice::iOS קומפל. צילומי הסימולטור ב-artifact sportdle-ios-sim (אם עלו). .ipa להתקנה במכשיר דורש חשבון מפתח אפל וחתימה."
